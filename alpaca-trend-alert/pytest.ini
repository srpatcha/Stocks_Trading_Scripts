[pytest]
asyncio_mode = auto
testpaths = tests
# StarletteDeprecationWarning was listed here unqualified, so pytest resolved
# it against builtins and aborted collection before a single test ran. The
# class was also removed in starlette 0.49, and it subclassed DeprecationWarning
# anyway, so the line above already covers it.
filterwarnings =
    ignore::DeprecationWarning
