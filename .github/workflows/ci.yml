name: CI — Stocks Plugin Trading System

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  # ─── Core Tests ────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pytest-cov pytest-asyncio
          pip install lightgbm joblib
          pip install pyyaml python-dotenv requests
          pip install fastapi uvicorn httpx pydantic
          pip install networkx
          pip install vaderSentiment || true
          pip install yfinance feedparser || true

      - name: Run production safety tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_production_safety.py -v --tb=short

      - name: Run new features tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_new_features.py -v --tb=short

      - name: Run risk manager tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_shared_risk_manager.py -v --tb=short

      - name: Run indicator tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_shared_indicators.py -v --tb=short

      - name: Run strategy tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_strategy_examples.py tests/test_shared_strategies.py -v --tb=short

      - name: Run self-learning agent tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_self_learning.py -v --tb=short

      - name: Run graph memory tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_graph_memory.py -v --tb=short

      # This step used to end in `|| true`, which also nullified
      # --cov-fail-under. The full suite could not fail the build, and a real
      # money-safety test had been failing unnoticed as a result.
      - name: Run full test suite with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/test_backtest_engine_v2.py \
            -m "not slow and not ml" \
            --cov=shared --cov=strategies \
            --cov=interactive_brokers --cov=tradingview \
            --cov=tradestation --cov=thinkorswim \
            --cov-report=term-missing \
            --cov-fail-under=50

  # ─── Security Scan ─────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      # Scope widened past shared/ and strategies/ — the broker clients and the
      # internet-facing webhook server were never scanned.
      - name: Run Bandit security scan
        run: |
          bandit -r shared/ strategies/ interactive_brokers/ tradingview/ \
                 tradestation/ thinkorswim/ \
                 -ll --skip B101,B603,B607 -f txt

      # The old version was `! grep ... || echo "...✅"`, which prints any
      # secret it finds and then exits 0. Verified: it could never fail.
      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential secrets..."
          if grep -rIn --include="*.py" -E "(password|api_key|secret|token)\s*=\s*['\"][^'\"]+['\"]" \
               shared/ strategies/ interactive_brokers/ tradingview/ \
               tradestation/ thinkorswim/ \
             | grep -v "test_" \
             | grep -vE "os\.(getenv|environ)" \
             | grep -vE "(CHANGE_ME|<INSERT|example|placeholder|YOUR_|\.\.\.)"; then
            echo "::error::Possible hardcoded secret found"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Check for unsafe eval/exec
        run: |
          echo "Scanning for eval/exec..."
          if grep -rIn --include="*.py" -E "(^|[^.\w])(eval|exec)\(" \
               shared/ strategies/ interactive_brokers/ tradingview/ \
               tradestation/ thinkorswim/; then
            echo "::error::Unsafe eval/exec found"
            exit 1
          fi
          echo "No unsafe eval/exec found"

      - name: Audit dependencies for known CVEs
        run: pip-audit --requirement requirements.txt --strict || true

  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install flake8 pycodestyle

      # Was a hand-maintained list of ten files. Compile everything that is
      # tracked, minus the vendored trees, so a new file cannot slip past.
      - name: Syntax check all Python files
        run: |
          git ls-files '*.py' \
            | grep -v '^ghostfolio/' \
            | xargs -r python -m py_compile
          echo "All files compile ✅"

      - name: Flake8 (errors only)
        run: |
          flake8 shared/ strategies/ interactive_brokers/ tradingview/ \
                 tradestation/ thinkorswim/ \
                 --count --select=E9,F63,F7,F82 --show-source --statistics

  # ─── Strategy Validation ───────────────────────────────────────────────────
  validate-strategies:
    name: Validate All 15 Strategies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy
          pip install vaderSentiment || true
          pip install yfinance feedparser || true
          pip install lightgbm joblib || true

      - name: Verify all 15 strategies register
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          import strategies.examples.trend_following
          import strategies.examples.breakout
          import strategies.examples.mean_reversion
          import strategies.examples.factor_portfolio
          import strategies.examples.darvas_box
          import strategies.examples.triple_screen
          import strategies.examples.canslim_strategy
          import strategies.examples.value_strategy
          import strategies.examples.ml_rl_strategy
          import strategies.examples.self_learning_strategy
          import strategies.examples.sentiment_strategy
          import strategies.examples.earnings_strategy
          import strategies.examples.sector_rotation
          import strategies.examples.meta_strategy
          from strategies import STRATEGY_REGISTRY
          count = len(STRATEGY_REGISTRY)
          print(f'Registered strategies: {count}/15')
          for name in sorted(STRATEGY_REGISTRY.keys()):
              print(f'  ✅ {name}')
          assert count >= 14, f'Only {count} strategies registered!'
          print('All strategies validated ✅')
          "

  # ─── Release ────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [test, security, lint, validate-strategies]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            ## Stocks Plugin ${{ steps.version.outputs.VERSION }}

            ### 15 Trading Strategies
            Trend Following, Breakout, Mean Reversion, Factor Portfolio, Darvas Box,
            Triple Screen, CAN SLIM, Graham Value, ML (LSTM), RL (PPO), Self-Learning,
            News Sentiment, Earnings Calendar, Sector Rotation, Meta Ensemble

            ### 7-Layer Risk Management
            Per-trade risk, cooldown, daily limit, monthly cap, circuit breaker,
            position cap, portfolio heat

            ### Production Safety
            Fat-finger protection, price sanity checks, short-selling limits,
            liquidity filters, market hours enforcement, thread-safe state persistence

            ### Data Sources
            OHLCV prices, volume, fundamentals, news sentiment, earnings calendar,
            ML signals, market regime detection — all wired to every strategy

            See PRODUCTION_README.md for full documentation.
          draft: false
          prerelease: false
          generate_release_notes: true
