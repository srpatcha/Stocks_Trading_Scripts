[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocks_plugin"
version = "0.1.0"
requires-python = ">=3.9"
# AGPL-3.0 because the repository vendors AGPL-3.0 (ghostfolio) and GPL-3.0
# (alpaca-trend-alert) code in-tree. See NOTICE.md.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

# Package discovery must be explicit. This is a flat layout with twelve
# top-level directories, so setuptools' automatic discovery refuses to guess:
#
#   error: Multiple top-level packages discovered in a flat-layout:
#   ['promo', 'shared', 'strategies', 'tradingview', ...]
#
# and `pip install -e .` failed outright. Listed below are the directories that
# actually carry an __init__.py; the rest (promo, tradingview, thinkorswim,
# tradestation) are script and asset directories, not importable packages.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "shared*",
    "strategies*",
    "backtrader_adapter*",
    "freqtrade_adapter*",
    "interactive_brokers*",
    "lean_adapter*",
    "portfolio_backtester*",
    "zipline_adapter*",
]
exclude = ["tests*", "promo*", "tradingview*", "thinkorswim*", "tradestation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ml: marks tests requiring ML dependencies",
    "live_enricher: opt out of the neutral StrategyEnricher stub (hits the network)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
# The broker clients and the internet-facing webhook server were absent from
# this list, so ~13k lines — including every line that can place a real order —
# contributed nothing to the coverage gate.
source = [
    "shared",
    "strategies",
    "interactive_brokers",
    "tradingview",
    "tradestation",
    "thinkorswim",
]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/examples/run_*",
]

[tool.coverage.report]
show_missing = true
fail_under = 60
# These are regexes matched with re.search against the line text, not
# statement types. A bare "pass" therefore also matched any line containing
# "password" — it was excluding server.login(smtp_user, smtp_password) in
# alert_dispatcher.py from coverage. "except ImportError" excluded 50 optional
# dependency fallbacks, the paths most likely to silently degrade. Both are
# anchored now.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "^\\s*raise NotImplementedError",
    "^\\s*pass\\s*$",
]
