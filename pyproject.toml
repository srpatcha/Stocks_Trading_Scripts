[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocks_plugin"
version = "0.1.0"
requires-python = ">=3.9"

# Package discovery must be explicit. This is a flat layout with twelve
# top-level directories, so setuptools' automatic discovery refuses to guess:
#
#   error: Multiple top-level packages discovered in a flat-layout:
#   ['promo', 'shared', 'strategies', 'tradingview', ...]
#
# and `pip install -e .` failed outright. Listed below are the directories that
# actually carry an __init__.py; the rest (promo, tradingview, thinkorswim,
# tradestation) are script and asset directories, not importable packages.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "shared*",
    "strategies*",
    "backtrader_adapter*",
    "freqtrade_adapter*",
    "interactive_brokers*",
    "lean_adapter*",
    "portfolio_backtester*",
    "zipline_adapter*",
]
exclude = ["tests*", "promo*", "tradingview*", "thinkorswim*", "tradestation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ml: marks tests requiring ML dependencies",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["shared", "strategies"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/examples/run_*",
]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
